      <rect x="178" y="0" width="96"  height="10" fill="#F1E05A"/>
      <rect x="274" y="0" width="44"  height="10" fill="#E38C00"/>
      <rect x="318" y="0" width="26"  height="10" fill="#3572A5"/>
      <rect x="344" y="0" width="15"  height="10" fill="#89E051"/>
